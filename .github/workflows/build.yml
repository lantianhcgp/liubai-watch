name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo python3 -c '
          from pathlib import Path
          import re
          paths = [Path("/etc/apt/sources.list")]
          paths += sorted(Path("/etc/apt/sources.list.d").glob("*.list"))
          paths += sorted(Path("/etc/apt/sources.list.d").glob("*.sources"))
          pattern = r"https?://(?:azure\.archive|archive|security)\.ubuntu\.com/ubuntu(?=/|\s|$)"
          for path in paths:
              if path.is_file():
                  before = path.read_text()
                  after = re.sub(pattern, "https://mirrors.edge.kernel.org/ubuntu", before)
                  if after != before:
                      path.write_text(after)
          '
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev
      - name: Download actual HarmonyOS compiler
        uses: ErBWs/setup-ohos@v2
        with:
          version: 6.1.1.280
          cache: true
      - name: Expose toolchain
        shell: bash
        run: |
          for p in "$HOME/ohos-sdk/command-line-tools/bin" "$HOME/ohos-sdk/command-line-tools/tool/node/bin"; do
            if [ -d "$p" ]; then printf '%s\n' "$p" >> "$GITHUB_PATH"; fi
          done
          if [ -d "$HOME/ohos-sdk/command-line-tools/sdk" ]; then
            printf '%s\n' "HOS_SDK_HOME=$HOME/ohos-sdk/command-line-tools/sdk" >> "$GITHUB_ENV"
          fi
      - name: Checkout pinned read-only keyboard reference for parity tests
        run: |
          ref_dir="$GITHUB_WORKSPACE/../crabKeyboard"
          git init "$ref_dir"
          git -C "$ref_dir" fetch --depth=1 https://github.com/crabPangXie/crabKeyboard.git 656f8ad842a8692bc3b2b975d6b648880232c592
          git -C "$ref_dir" checkout --detach FETCH_HEAD
      - name: Generate credential-free logger config
        run: |
          npm ci --prefix scripts --no-audit --no-fund
          python3 scripts/prepare-logsink.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --experimental-vm-modules --test tests/*.test.mjs
      - name: Compile and verify unsigned app
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: liubai-unsigned-${{ github.run_number }}
          path: build/outputs/default/*.app
          if-no-files-found: error
          retention-days: 1
