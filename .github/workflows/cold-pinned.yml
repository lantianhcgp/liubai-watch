name: liubai-official-signed-payload
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful complete compiler workflow run
        required: true
        type: string
      source_sha:
        description: Exact compiler source commit
        required: true
        type: string
      signed_fixture:
        description: Safe signed-record hashes and config only, never signing keys or profile
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  signed:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lantianhcgp/deveco-sim-ci
          ref: aa3a315a766f6dd4983ad8dad9eed2c948c6faba
          ssh-key: ${{ secrets.LIUBAI_OFFICIAL_SIM_SSH_KEY }}
          persist-credentials: false
          path: _sim
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          name: liubai-elcton-${{ inputs.build_run }}
          path: _built
      - name: Exact source and locally verified signed record table
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
          EXPECTED_RUN: ${{ inputs.build_run }}
          SIGNED_FIXTURE: ${{ inputs.signed_fixture }}
        run: |
          python3 -c 'import os,json,re;from pathlib import Path;s=os.environ["EXPECTED_SOURCE"];assert re.fullmatch(r"[0-9a-f]{40}",s);assert re.fullmatch(r"[0-9]{10,13}",os.environ["EXPECTED_RUN"]);assert Path("_built/source-sha.txt").read_text().strip()==s;f=json.loads(os.environ["SIGNED_FIXTURE"]);assert set(f)=={"schema","compilerAppSha256","signedHapSha256","bundle","signedConfigBase64","records"};Path("_signed").mkdir();Path("_signed/signed-fixture.json").write_text(json.dumps(f))'
          python3 tests/test_signed_input.py
          python3 qa/signed_input.py --compiler _built/liubai-elcton-v3.app --fixture _signed/signed-fixture.json --output _signed/exact-native.app --report signed-evidence/signed-native-input-proof.json
      - name: Genuine cold process restart of exact signed resources
        run: |
          APP_SHA=$(python3 -c 'import json;from pathlib import Path;print(json.loads(Path("signed-evidence/signed-native-input-proof.json").read_text())["nativeInputAppSha256"])')
          BUNDLE=$(python3 -c 'import json;from pathlib import Path;print(json.loads(Path("signed-evidence/signed-native-input-proof.json").read_text())["bundle"])')
          python3 qa/official_cold.py --sim _sim --app _signed/exact-native.app --out signed-evidence/cold-restart --expected-sha "$APP_SHA" --expected-bundle "$BUNDLE"
      - name: Genuine four-window user paths on the exact signed payload
        run: |
          BUNDLE=$(python3 -c 'import json;from pathlib import Path;print(json.loads(Path("signed-evidence/signed-native-input-proof.json").read_text())["bundle"])')
          python3 qa/official.py --sim _sim --app _signed/exact-native.app --out signed-evidence --expected-bundle "$BUNDLE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liubai-signed-native-${{ github.run_id }}
          path: signed-evidence/
          if-no-files-found: error
