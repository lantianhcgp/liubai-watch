# Isolated r18 diagnostic lane on a workflow already registered by GitHub.
name: r18-official-compiler-experiment
on:
  push:
    branches: [fix/r18-native-runtime]
    paths:
      - 'qa/install-r18-official/**'
      - '.github/workflows/r17-official.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: liubai-r18-native-experiment
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lantianhcgp/deveco-sim-ci
          ref: aa3a315a766f6dd4983ad8dad9eed2c948c6faba
          ssh-key: ${{ secrets.LIUBAI_OFFICIAL_SIM_SSH_KEY }}
          persist-credentials: false
          path: _sim
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode native frames
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          name: r18-runtime-11
          run-id: 41557916931
          github-token: ${{ github.token }}
          path: _compiler
      - name: Verify pinned complete compiled artifact
        run: |
          set -o pipefail
          python3 -c 'from pathlib import Path;import json,hashlib;d=Path("_compiler/r18-runtime");r=json.loads((d/"provenance.json").read_text());p=d/"liubai-r18-complete.app";assert r["sourceHead"]=="6127a2d5e138bf451e28edd2f48b7c1c9c64d048";assert r["candidateAppSha256"]==hashlib.sha256(p.read_bytes()).hexdigest()=="d232e1cec014bc4a7b158005f472510219a1d4f28190862b90ff7f1f5bb8c1b3";assert len(r["pages"])==8 and r["pageSelectionPerformed"] is False;assert r["parserVerdict"]["status"] in ["passed-small-cli","inconclusive-small-cli-heap"];print("PINNED_COMPLETE_COMPILER_ARTIFACT_VERIFIED")'
      - name: Run unchanged complete compiled application on official 512KB engine
        run: |
          set -o pipefail
          python3 qa/install-r18-official/test_flow.py
          python3 qa/install-r18-official/test_semantics.py
          python3 qa/install-r18-official/test_resources.py
          python3 qa/install-r18-official/acceptance.py --sim _sim --app _compiler/r18-runtime/liubai-r18-complete.app --restart --out build/r18-official
      - name: Save raw experiment evidence - not release approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18-official-${{ github.run_number }}
          path: build/r18-official
          if-no-files-found: error
