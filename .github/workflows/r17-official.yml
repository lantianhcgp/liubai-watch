# Isolated r18 diagnostic lane on a workflow already registered by GitHub.
name: r18-official-compiler-experiment
on:
  push:
    branches: [fix/r18-native-runtime]
    paths:
      - 'qa/install-r18-official/**'
      - '.github/workflows/r17-official.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: liubai-r18-native-experiment
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lantianhcgp/deveco-sim-ci
          ref: aa3a315a766f6dd4983ad8dad9eed2c948c6faba
          ssh-key: ${{ secrets.LIUBAI_OFFICIAL_SIM_SSH_KEY }}
          persist-credentials: false
          path: _sim
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode native frames
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          name: r18-runtime-14
          run-id: 41574958463
          github-token: ${{ github.token }}
          path: _compiler
      - name: Verify pinned complete compiled artifact
        run: |
          set -o pipefail
          python3 -c 'from pathlib import Path;import json,hashlib;d=Path("_compiler/r18-runtime");r=json.loads((d/"provenance.json").read_text());p=d/"liubai-r18-complete.app";assert r["sourceHead"]=="0176dc6d7e105939197a7a045260a4c35605deef";assert r["candidateAppSha256"]==hashlib.sha256(p.read_bytes()).hexdigest()=="0bf283d6243ca0b4d17eb1e65d75d8d6f231c1acffcb1d4a48f3cef7af5fb642";assert len(r["pages"])==8 and r["pageSelectionPerformed"] is False;assert r["parserVerdict"]["status"] in ["passed-small-cli","inconclusive-small-cli-heap"];print("PINNED_COMPLETE_COMPILER_ARTIFACT_VERIFIED")'
      - name: Prepare exact records read back from the locally verified signed HAP
        run: |
          set -o pipefail
          python3 qa/install-r18-signed/test_prepare.py
          python3 qa/install-r18-signed/prepare.py --compiler _compiler/r18-runtime/liubai-r18-complete.app --fixture qa/install-r18-signed/exact-signed-records.json --output _signed/exact-native.app --report build/r18-official/signed-native-input-proof.json
          # Local reference ZIP digest e326666830c385df13fdb67d591280fed79e224d3a329b67ef449c1c2e986a9c.
          # ZIP compression can differ; all 255 signed records must still be byte-exact.
          python3 -c 'from pathlib import Path;import json;f=json.loads(Path("qa/install-r18-signed/exact-signed-records.json").read_text());r=json.loads(Path("build/r18-official/signed-native-input-proof.json").read_text());assert r["signedRecordsByteExact"] is True and r["files"]==255;assert r["signedHapSha256"]==f["signedHapSha256"]=="9064f62640d61536f630c0c211d1a20a705246c19a8d9aefada00ac86f4b5527";assert r["bundle"]=="liubai.nexus.by71x";print("SIGNED_HAP_RECORDS_EXACT")'
      - name: Run exact signed payload on official 512KB engine - not an installation test
        run: |
          set -o pipefail
          python3 qa/install-r18-official/test_flow.py
          python3 qa/install-r18-official/test_semantics.py
          python3 qa/install-r18-official/test_resources.py
          python3 qa/install-r18-official/acceptance.py --sim _sim --app _signed/exact-native.app --restart --out build/r18-official
      - name: Save raw experiment evidence - not release approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18-official-${{ github.run_number }}
          path: build/r18-official
          if-no-files-found: error
